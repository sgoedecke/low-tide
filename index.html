<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#236d72">
  <meta name="description" content="Dig channels, build sand walls, and let the tide find its way.">
  <title>Low Tide</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="beach">
    <canvas id="surface" aria-hidden="true"></canvas>
    <canvas id="canvas" aria-label="Interactive beach. Drag to use the selected tool; right-drag to dig. Keyboard: 1 for dig, 2 for build. Digging collects sand; building spends it. The sand-colored circle shows your supply."></canvas>
    <div id="sand-supply" role="img" aria-label="Sand supply. Dig to collect more; build to spend it."></div>
    <div class="tools" role="group" aria-label="Sand tools">
      <button class="tool" data-tool="dig" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 3 6 6M18 6l-7 7M8 10l6 6-4 4c-5 3-9-1-6-6Z"/></svg>
        <span>Dig</span>
      </button>
      <button class="tool selected" data-tool="build" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16l-2 13H6ZM8 8V6a4 4 0 0 1 8 0v2M3 8h18"/></svg>
        <span>Build</span>
      </button>
    </div>
  </main>
  <script type="module" src="game.mjs"></script>
</body>
</html>
